name: Keep Render instance awake

# Render's free tier spins down a web service after ~15 minutes with no inbound HTTP
# traffic, which would drop every open WebSocket. Pinging /health every 10 minutes
# keeps it under that threshold. GitHub's schedule trigger isn't perfectly punctual
# (can drift a few minutes under platform load), so this isn't airtight — just
# good-enough for a hobby deployment. Needs a `RENDER_HEALTH_URL` repo variable set
# to the real https://<service>.onrender.com/health URL once the service is deployed
# (Settings → Secrets and variables → Actions → Variables).
on:
    schedule:
        - cron: '*/10 * * * *'
    workflow_dispatch:

jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            - name: Ping health endpoint
              run: curl -sf "${{ vars.RENDER_HEALTH_URL }}"
